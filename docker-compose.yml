services:
  db:
    image: postgres:18-alpine
    container_name: debate_engine_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-debate_db}
      POSTGRES_USER: ${POSTGRES_USER:-debate_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-debate_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-debate_user} -d ${POSTGRES_DB:-debate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: debate_engine_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: ${DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:-insecure-dev-key}
      DB_NAME: ${POSTGRES_DB:-debate_db}
      DB_USER: ${POSTGRES_USER:-debate_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-debate_secret}
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
